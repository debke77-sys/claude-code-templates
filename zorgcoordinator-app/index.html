<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zorgplanner</title>
<style>
  :root {
    --blauw: #2563eb;
    --blauw-donker: #1d4ed8;
    --groen: #16a34a;
    --geel: #ca8a04;
    --oranje: #ea580c;
    --rood: #dc2626;
    --grijs-bg: #f4f6f9;
    --grijs-rand: #d9dee5;
    --grijs-tekst: #5b6472;
    --tekst: #1f2937;
    --wit: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--grijs-bg);
    color: var(--tekst);
  }
  header {
    background: var(--wit);
    border-bottom: 1px solid var(--grijs-rand);
    padding: 0 24px;
  }
  header .titelbalk {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0 8px 0;
  }
  header h1 {
    font-size: 20px;
    margin: 0;
  }
  header h1 .sub {
    font-weight: 400;
    color: var(--grijs-tekst);
    font-size: 14px;
    display: block;
    margin-top: 2px;
  }
  nav {
    display: flex;
    gap: 4px;
    padding-bottom: 0;
  }
  nav button {
    border: none;
    background: none;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    color: var(--grijs-tekst);
    border-bottom: 3px solid transparent;
    border-radius: 6px 6px 0 0;
  }
  nav button.actief {
    color: var(--blauw-donker);
    border-bottom: 3px solid var(--blauw);
    font-weight: 600;
    background: #eef3ff;
  }
  nav button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px;
  }
  .kaart {
    background: var(--wit);
    border: 1px solid var(--grijs-rand);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .kaart h2 {
    margin-top: 0;
    font-size: 17px;
  }
  .melding {
    background: #eef3ff;
    border: 1px solid #c7d7fb;
    color: var(--blauw-donker);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .melding.melding-ok { background: #eafaf1; border-color: #b7e4c7; color: #166534; }
  .melding.melding-waarschuwing { background: #fef9e7; border-color: #fbe8a6; color: #92600a; }
  .melding.melding-kritiek { background: #fdecec; border-color: #f5c2c2; color: var(--rood); }
  .samenvatting {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .tegel {
    flex: 1;
    min-width: 150px;
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--wit);
  }
  .tegel .getal { font-size: 28px; font-weight: 700; display: block; }
  .tegel .label { font-size: 13px; opacity: 0.9; }
  .tegel.rood { background: var(--rood); }
  .tegel.oranje { background: var(--oranje); }
  .tegel.geel { background: var(--geel); }
  .tegel.grijs { background: var(--grijs-tekst); }
  .filters {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    align-items: center;
  }
  .filters label {
    font-size: 13px;
    color: var(--grijs-tekst);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  select, input[type=text], input[type=number], input[type=date] {
    padding: 7px 10px;
    border: 1px solid var(--grijs-rand);
    border-radius: 6px;
    font-size: 14px;
    background: var(--wit);
    color: var(--tekst);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    text-align: left;
    padding: 9px 10px;
    border-bottom: 1px solid #eef1f5;
  }
  th {
    color: var(--grijs-tekst);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  tr:hover td { background: #fafbfd; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    color: var(--wit);
  }
  .badge.verlopen { background: var(--rood); }
  .badge.deze-week { background: var(--oranje); }
  .badge.deze-maand { background: var(--geel); }
  .badge.later { background: #64748b; }
  button.actie {
    background: var(--blauw);
    color: var(--wit);
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    margin-right: 6px;
  }
  button.actie:hover { background: var(--blauw-donker); }
  button.subtiel {
    background: none;
    border: 1px solid var(--grijs-rand);
    color: var(--tekst);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  button.subtiel:hover { background: var(--grijs-bg); }
  button.gevaar {
    background: none;
    border: 1px solid #f3c6c6;
    color: var(--rood);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .rij-form {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 12px;
  }
  details.instellingen summary {
    cursor: pointer;
    font-weight: 600;
    color: var(--blauw-donker);
    padding: 6px 0;
  }
  .instel-blok { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--grijs-rand); }
  .instel-blok h3 { font-size: 14px; margin-bottom: 8px; }
  .locatie-overzicht td, .locatie-overzicht th { text-align: center; }
  .locatie-overzicht td:first-child, .locatie-overzicht th:first-child { text-align: left; }
  footer {
    text-align: center;
    color: var(--grijs-tekst);
    font-size: 12px;
    padding: 20px;
  }
  #toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--tekst);
    color: var(--wit);
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 14px;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.25s ease;
    pointer-events: none;
    max-width: 320px;
  }
  #toast.zichtbaar { opacity: 1; transform: translateY(0); }
  .knopbalk { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .klein-label { font-size: 12px; color: var(--grijs-tekst); }
  textarea {
    padding: 7px 10px;
    border: 1px solid var(--grijs-rand);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    background: var(--wit);
    color: var(--tekst);
    resize: vertical;
    width: 100%;
  }
  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }
  .team-kaart {
    border: 1px solid var(--grijs-rand);
    border-radius: 10px;
    padding: 14px 16px;
    background: var(--wit);
  }
  .team-kaart h3 { margin: 0 0 4px 0; font-size: 15px; }
  .team-kaart .locatie { color: var(--grijs-tekst); font-size: 13px; margin-bottom: 10px; }
  .team-kaart .metriek { font-size: 13px; margin-bottom: 4px; }
  .profiel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 6px;
  }
  .profiel-header h2 { margin: 0; }
  .grow-kaart {
    border: 1px solid var(--grijs-rand);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    background: #fafbfd;
  }
  .grow-kaart .grow-veld { margin-bottom: 8px; }
  .grow-kaart label.mini-label { font-size: 12px; color: var(--grijs-tekst); display: block; margin-bottom: 3px; }
  .grow-kop { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .form-grid .breed { grid-column: 1 / -1; }
  .nieuw-form {
    border: 1px dashed var(--grijs-rand);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
    background: #f8fafc;
  }
  .dicteer-blok {
    border: 1px solid var(--grijs-rand);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    background: var(--wit);
  }
  button.opname-actief {
    background: var(--rood) !important;
    color: var(--wit) !important;
    border-color: var(--rood) !important;
    animation: dicteer-puls 1.4s ease-in-out infinite;
  }
  @keyframes dicteer-puls {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  .dicteer-note { font-size: 12px; color: var(--grijs-tekst); margin-top: 6px; }
</style>
</head>
<body>

<header>
  <div class="titelbalk">
    <h1>Zorgplanner
      <span class="sub">Voorbeeldomgeving met fictieve namen — vervang dit via Instellingen door je eigen gegevens</span>
    </h1>
  </div>
  <nav id="nav"></nav>
</header>

<main id="main"></main>

<footer>Alle gegevens worden alleen lokaal in deze browser opgeslagen (localStorage) — er wordt niets online verzonden.</footer>
<div id="toast"></div>

<script>
(function () {
  "use strict";

  const OPSLAGSLEUTEL = "zorgplanner-data-v1";

  /* ---------- Datumhelpers ---------- */
  function isoVan(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  function vandaag() { return isoVan(new Date()); }
  function naarNL(iso) {
    const [y, m, d] = iso.split("-");
    return `${d}-${m}-${y}`;
  }
  function voegMaandenToe(iso, maanden) {
    const d = new Date(iso + "T00:00:00");
    d.setMonth(d.getMonth() + maanden);
    return isoVan(d);
  }
  function dagenTot(iso) {
    const a = new Date(vandaag() + "T00:00:00");
    const b = new Date(iso + "T00:00:00");
    return Math.round((b - a) / 86400000);
  }
  function hashOffset(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h;
  }

      { id: "bew1", naam: "Jan Willemsen", locatieId: "loc1", zorgvraag: "Lichte dementie, heeft structuur en herhaling nodig in de dagindeling.", contactpersoonNaam: "Rita Willemsen", contactpersoonRelatie: "Dochter", contactpersoonTelefoon: "06-11122233" },
      { id: "bew2", naam: "Grietje Bosma", locatieId: "loc1", zorgvraag: "Rolstoelafhankelijk, redt zichzelf verder goed, houdt van gezelschap.", contactpersoonNaam: "Klaas Bosma", contactpersoonRelatie: "Zoon", contactpersoonTelefoon: "06-22233344" },
      { id: "bew3", naam: "Piet Hendriksen", locatieId: "loc1", zorgvraag: "Herstellende van een heupoperatie, extra aandacht bij transfers.", contactpersoonNaam: "Marieke Hendriksen", contactpersoonRelatie: "Dochter", contactpersoonTelefoon: "06-33344455" },
      { id: "bew4", naam: "Antonia de Groot", locatieId: "loc1", zorgvraag: "Diabetes type 2, vaste tijden voor maaltijden en medicatie belangrijk.", contactpersoonNaam: "Wim de Groot", contactpersoonRelatie: "Echtgenoot", contactpersoonTelefoon: "06-44455566" },

        taakTypes.filter((tt) => tt.doelgroep === persoonType).forEach((tt) => {

            persoonId: p.id,
            locatieId: p.locatieId,
            volgendeDatum: isoVan(d),
            laatsteVoltooid: null,
            historie: [],
          });
        });
      });

    maakTaken(medewerkers, "medewerker");

    /* --- Team: ontwikkeldoelen (GROW), observaties, gespreksverslagen (fictief) --- */

      const d = new Date();
      d.setDate(d.getDate() - dagen);
      return isoVan(d);

      const d = new Date();
      d.setDate(d.getDate() + dagen);
      return isoVan(d);
    }

  /* ---------- Status & opslag ---------- */
  let state = laadState();

  function laadState() {
    try {
      const ruw = localStorage.getItem(OPSLAGSLEUTEL);
      if (ruw) return migreer(JSON.parse(ruw));
    } catch (e) { /* corrupte data, opnieuw seeden */ }
    const nieuw = bouwVoorbeeldData();
    localStorage.setItem(OPSLAGSLEUTEL, JSON.stringify(nieuw));
    return nieuw;
  }
  function migreer(data) {
    // Vult ontbrekende collecties/velden aan voor data die met een eerdere versie is opgeslagen.
    if (!data.ontwikkeldoelen) data.ontwikkeldoelen = [];
    if (!data.observaties) data.observaties = [];
    if (!data.gespreksverslagen) data.gespreksverslagen = [];
    if (!data.acties) data.acties = [];
    if (!data.bewonerNotities) data.bewonerNotities = [];
    if (data.laatsteBackup === undefined) data.laatsteBackup = null;
    (data.bewoners || []).forEach((b) => {
      if (b.zorgvraag === undefined) b.zorgvraag = "";
      if (b.contactpersoonNaam === undefined) b.contactpersoonNaam = "";
      if (b.contactpersoonRelatie === undefined) b.contactpersoonRelatie = "";
      if (b.contactpersoonTelefoon === undefined) b.contactpersoonTelefoon = "";
    });
    return data;
  }
  function bewaarState() {
    localStorage.setItem(OPSLAGSLEUTEL, JSON.stringify(state));
  }

  function toon(bericht) {
    const el = document.getElementById("toast");
    el.textContent = bericht;
    el.classList.add("zichtbaar");
    clearTimeout(toon._t);
    toon._t = setTimeout(() => el.classList.remove("zichtbaar"), 3200);
  }

  /* ---------- Opzoekhelpers ---------- */
  function persoonNaam(taak) {
    const bron = taak.persoonType === "bewoner" ? state.bewoners : state.medewerkers;
    const p = bron.find((x) => x.id === taak.persoonId);
    return p ? p.naam : "(onbekend)";
  }
  function locatieNaam(id) {
    const l = state.locaties.find((x) => x.id === id);
    return l ? l.naam : "(onbekend)";
  }
  function taakTypeVan(id) { return state.taakTypes.find((t) => t.id === id); }

  function urgentieVanDatum(iso) {
    const dagen = dagenTot(iso);
    if (dagen < 0) return "verlopen";
    if (dagen <= 7) return "deze-week";
    if (dagen <= 30) return "deze-maand";
    return "later";
  }
  function statusVan(taak) { return urgentieVanDatum(taak.volgendeDatum); }
  const statusLabel = {
    verlopen: "Verlopen",
    "deze-week": "Deze week",
    "deze-maand": "Deze maand",
    later: "Later dit jaar",
  };

  /* ---------- Acties ---------- */
  function markeerAfgerond(taakId) {
    const taak = state.taken.find((t) => t.id === taakId);
    if (!taak) return;
    const tt = taakTypeVan(taak.taakTypeId);
    taak.historie.push(vandaag());
    taak.laatsteVoltooid = vandaag();
    taak.volgendeDatum = voegMaandenToe(vandaag(), tt.frequentieMaanden);
    bewaarState();
    render();
    toon(`Genoteerd als afgerond. Volgende "${tt.naam}" gepland op ${naarNL(taak.volgendeDatum)}.`);
  }

  function verzetDatum(taakId, nieuweDatum) {
    const taak = state.taken.find((t) => t.id === taakId);
    if (!taak || !nieuweDatum) return;
    taak.volgendeDatum = nieuweDatum;
    bewaarState();
    render();
    toon(`Datum aangepast naar ${naarNL(nieuweDatum)}.`);
  }

  function wijzigTaakType(id, veld, waarde) {
    const tt = taakTypeVan(id);
    if (!tt) return;
    if (veld === "frequentieMaanden") waarde = Math.max(1, parseInt(waarde, 10) || 1);
    tt[veld] = waarde;
    bewaarState();
    render();
  }

  function verwijderTaakType(id) {
    if (!confirm("Dit taaktype en alle bijbehorende geplande taken verwijderen?")) return;
    state.taakTypes = state.taakTypes.filter((t) => t.id !== id);
    state.taken = state.taken.filter((t) => t.taakTypeId !== id);
    bewaarState();
    render();
  }

  function nieuwTaakType() {
    const doelgroep = "bewoner";
    const tt = { id: nieuwId("tt"), naam: "Nieuw taaktype", doelgroep, frequentieMaanden: 12, omschrijving: "" };
    state.taakTypes.push(tt);
    const doelpersonen = doelgroep === "bewoner" ? state.bewoners : state.medewerkers;
    doelpersonen.forEach((p) => {
      state.taken.push({
        id: nieuwId("taak"), taakTypeId: tt.id, persoonType: doelgroep, persoonId: p.id,
        locatieId: p.locatieId, volgendeDatum: voegMaandenToe(vandaag(), tt.frequentieMaanden),
        laatsteVoltooid: null, historie: [],
      });
    });
    bewaarState();
    render();
  }

  function voegPersoonToe(type) {
    const naam = prompt(`Naam van de nieuwe ${type === "bewoner" ? "bewoner" : "medewerker"}:`);
    if (!naam || !naam.trim()) return;
    if (state.locaties.length === 0) { alert("Voeg eerst een locatie toe."); return; }
    const locatieId = state.locaties[0].id;
    const p = { id: nieuwId(type === "bewoner" ? "bew" : "med"), naam: naam.trim(), locatieId };
    if (type === "bewoner") Object.assign(p, { zorgvraag: "", contactpersoonNaam: "", contactpersoonRelatie: "", contactpersoonTelefoon: "" });
    (type === "bewoner" ? state.bewoners : state.medewerkers).push(p);
    state.taakTypes.filter((tt) => tt.doelgroep === type).forEach((tt) => {
      state.taken.push({
        id: nieuwId("taak"), taakTypeId: tt.id, persoonType: type, persoonId: p.id,
        locatieId, volgendeDatum: voegMaandenToe(vandaag(), tt.frequentieMaanden),
        laatsteVoltooid: null, historie: [],
      });
    });
    bewaarState();
    render();
    toon(`${naam.trim()} toegevoegd. Standaardlocatie: ${locatieNaam(locatieId)} — pas dit zo nodig aan.`);
  }

  function verwijderPersoon(type, id) {
    const bron = type === "bewoner" ? "bewoners" : "medewerkers";
    if (!confirm("Deze persoon en alle bijbehorende geplande taken verwijderen?")) return;
    state[bron] = state[bron].filter((p) => p.id !== id);
    state.taken = state.taken.filter((t) => !(t.persoonType === type && t.persoonId === id));
    bewaarState();
    render();
  }

  function wijzigPersoonLocatie(type, id, locatieId) {
    const bron = type === "bewoner" ? state.bewoners : state.medewerkers;
    const p = bron.find((x) => x.id === id);
    if (!p) return;
    p.locatieId = locatieId;
    state.taken.filter((t) => t.persoonType === type && t.persoonId === id).forEach((t) => t.locatieId = locatieId);
    bewaarState();
    render();
  }

  function voegLocatieToe() {
    const naam = prompt("Naam van de nieuwe locatie:");
    if (!naam || !naam.trim()) return;
    state.locaties.push({ id: nieuwId("loc"), naam: naam.trim() });
    bewaarState();
    render();
  }

  function verwijderLocatie(id) {
    const inGebruik = state.bewoners.some((b) => b.locatieId === id) || state.medewerkers.some((m) => m.locatieId === id);
    if (inGebruik) { alert("Verplaats eerst alle bewoners en medewerkers van deze locatie naar een andere locatie."); return; }
    if (!confirm("Deze locatie verwijderen?")) return;
    state.locaties = state.locaties.filter((l) => l.id !== id);
    bewaarState();
    render();
  }

  function resetVoorbeelddata() {
    if (!confirm("Alle huidige gegevens wissen en terugzetten naar de fictieve voorbeelddata? Dit kan niet ongedaan worden gemaakt.")) return;
    state = bouwVoorbeeldData();
    bewaarState();
    render();
    toon("Teruggezet naar de voorbeelddata.");
  }

  function exporteer() {
    state.laatsteBackup = vandaag();
    bewaarState();
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `zorgplanner-backup-${vandaag()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    render();
  }

  function importeer(bestand) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data.locaties || !data.taken) throw new Error("ongeldig bestand");
        if (!confirm("Huidige gegevens vervangen door de inhoud van dit back-upbestand?")) return;
        state = data;
        bewaarState();
        render();
        toon("Back-up geïmporteerd.");
      } catch (e) {
        alert("Dit bestand kon niet worden gelezen als een geldige back-up.");
      }
    };
    reader.readAsText(bestand);
  }

  /* ---------- Dicteren en automatische analyse (observatiedagboek) ---------- */
  function ondersteuntDicteren() {
    return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  }

  let actieveHerkenning = null;

  function startDicteren(textareaId, knopId) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      alert("Dicteren wordt niet ondersteund in deze browser. Gebruik Chrome of Edge, of typ de tekst zelf.");
      return;
    }
    const herkenning = new SR();
    herkenning.lang = "nl-NL";
    herkenning.continuous = true;
    herkenning.interimResults = true;

    const textarea = document.getElementById(textareaId);
    let finaleTekst = textarea ? textarea.value : "";

    herkenning.onresult = (event) => {
      let interim = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const stuk = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finaleTekst += (finaleTekst && !finaleTekst.endsWith(" ") ? " " : "") + stuk.trim();
        } else {
          interim += stuk;
        }
      }
      const el = document.getElementById(textareaId);
      if (el) el.value = finaleTekst + (interim ? " " + interim : "");
    };
    herkenning.onerror = (event) => {
      toon("Dicteren gestopt: " + (event.error === "not-allowed" ? "microfoontoegang geweigerd." : event.error));
      herkenningKnopReset(knopId);
      actieveHerkenning = null;
    };
    herkenning.onend = () => {
      herkenningKnopReset(knopId);
      actieveHerkenning = null;
    };

    herkenning.start();
    actieveHerkenning = herkenning;
    const knop = document.getElementById(knopId);
    if (knop) { knop.textContent = "⏹ Stop dicteren"; knop.classList.add("opname-actief"); }
  }

  function stopDicteren() {
    if (actieveHerkenning) actieveHerkenning.stop();
  }

  function herkenningKnopReset(knopId) {
    const knop = document.getElementById(knopId);
    if (knop) { knop.textContent = "🎤 Start dicteren"; knop.classList.remove("opname-actief"); }
  }

  function analyseerObservatieTekst(tekst) {
    const zinnen = tekst.split(/(?<=[.!?])\s+|\n+/).map((z) => z.trim()).filter(Boolean);
    const trefwoorden = {
      interpretatie: [/waarschijnlijk/i, /lijkt (erop )?dat/i, /denk(t)? dat/i, /duidt (op|erop)/i, /conclu(deer|sie)/i, /mogelijk/i, /vermoedelijk/i, /verklaart/i, /komt (waarschijnlijk )?door/i],
      hoor: [/\bhoor(t|de)?\b/i, /\bzeg(t|de)?\b/i, /\broep(t|en)?\b|riep/i, /vertel(t|de)?\b/i, /\bstem\b/i, /geluid/i, /\bpraat(te)?\b/i, /schreeuw/i, /fluister/i],
      zie: [/\bzie(t)?\b|zag/i, /\bkijk(t)?\b|keek/i, /gezicht/i, /houding/i, /\bloopt\b|liep/i, /\bstaat\b|stond/i, /\bligt\b|lag/i, /beweegt|bewoog/i, /oogcontact/i],
      voel: [/\bvoel(t|de)?\b/i, /sfeer/i, /gevoel/i, /spanning/i, /onrust/i, /rustig/i, /ontspann/i, /\bblij\b/i, /verdrietig/i, /geïrriteerd|irritatie/i],
    };
    const resultaat = { hoor: [], zie: [], voel: [], interpretatie: [] };
    zinnen.forEach((zin) => {
      if (trefwoorden.interpretatie.some((re) => re.test(zin))) resultaat.interpretatie.push(zin);
      else if (trefwoorden.hoor.some((re) => re.test(zin))) resultaat.hoor.push(zin);
      else if (trefwoorden.zie.some((re) => re.test(zin))) resultaat.zie.push(zin);
      else if (trefwoorden.voel.some((re) => re.test(zin))) resultaat.voel.push(zin);
      else resultaat.zie.push(zin);
    });
    return {
      hoor: resultaat.hoor.join(" "),
      zie: resultaat.zie.join(" "),
      voel: resultaat.voel.join(" "),
      interpretatie: resultaat.interpretatie.join(" "),
    };
  }

  function vulOfVoegToe(veldId, tekst) {
    if (!tekst) return;
    const el = document.getElementById(veldId);
    if (!el) return;
    el.value = el.value && el.value.trim() ? el.value.trim() + " " + tekst : tekst;
  }

  function analyseerEnVerdeel(vrijeTekstId, doelen) {
    const tekst = (document.getElementById(vrijeTekstId) || {}).value || "";
    if (!tekst.trim()) { alert("Dicteer of typ eerst tekst in het vrije-tekstveld hierboven."); return; }
    const resultaat = analyseerObservatieTekst(tekst);
    vulOfVoegToe(doelen.hoor, resultaat.hoor);
    vulOfVoegToe(doelen.zie, resultaat.zie);
    vulOfVoegToe(doelen.voel, resultaat.voel);
    vulOfVoegToe(doelen.interpretatie, resultaat.interpretatie);
    toon("Tekst automatisch verdeeld over hoor/zie/voel/interpreteer — controleer en pas aan waar nodig.");
  }

    const tabs = [
      { id: "dashboard", label: "Dashboard", actief: true },

  function verzamelAandachtspunten() {
    const punten = [];

    state.taken.forEach((t) => {
      const urgentie = statusVan(t);
      if (urgentie !== "verlopen" && urgentie !== "deze-week") return;
      const tt = taakTypeVan(t.taakTypeId);
      punten.push({
        bron: "jaarplanning", id: t.id, titel: tt ? tt.naam : "(verwijderd)",
        persoonNaam: persoonNaam(t), persoonType: t.persoonType, persoonId: t.persoonId,
        locatieId: t.locatieId, datum: t.volgendeDatum, urgentie,
      });
    });

    state.acties.forEach((a) => {
      const urgentie = actieUrgentie(a);
      if (urgentie !== "verlopen" && urgentie !== "deze-week") return;
      punten.push({
        bron: "actielijst", id: a.id, titel: a.titel,
        persoonNaam: actiePersoonNaam(a), persoonType: a.persoonType, persoonId: a.persoonId,
        locatieId: a.locatieId, datum: a.deadline, urgentie,
      });
    });

    state.ontwikkeldoelen.forEach((d) => {
      if (d.status !== "open") return;
      const urgentie = urgentieVanDatum(d.streefdatum);
      if (urgentie !== "verlopen" && urgentie !== "deze-week") return;
      const medewerker = state.medewerkers.find((m) => m.id === d.medewerkerId);
      punten.push({
        bron: "ontwikkeldoel", id: d.id, titel: d.titel,
        persoonNaam: medewerker ? medewerker.naam : "(onbekend)", persoonType: "medewerker", persoonId: d.medewerkerId,
        locatieId: medewerker ? medewerker.locatieId : null, datum: d.streefdatum, urgentie,
      });
    });

    punten.sort((a, b) => a.datum.localeCompare(b.datum));
    return punten;
  }

  function backupStatusInfo() {
    if (!state.laatsteBackup) {
      return { tekst: "Je hebt nog geen back-up gemaakt. Maak er één via Jaarplanning → Instellingen → Back-up, zodat je gegevens niet verloren gaan.", klasse: "kritiek" };
    }
    const dagenGeleden = -dagenTot(state.laatsteBackup);
    const meervoud = dagenGeleden === 1 ? "dag" : "dagen";
    if (dagenGeleden <= 14) {
      return { tekst: `Laatste back-up: ${naarNL(state.laatsteBackup)} (${dagenGeleden} ${meervoud} geleden).`, klasse: "ok" };
    }
    if (dagenGeleden <= 30) {
      return { tekst: `Laatste back-up: ${naarNL(state.laatsteBackup)} (${dagenGeleden} ${meervoud} geleden) — overweeg binnenkort een nieuwe back-up.`, klasse: "waarschuwing" };
    }
    return { tekst: `Laatste back-up: ${naarNL(state.laatsteBackup)} (${dagenGeleden} ${meervoud} geleden) — maak snel een nieuwe back-up.`, klasse: "kritiek" };
  }

          <tbody>${locatieRijen}</tbody>

  function renderJaarplanning() {

          <td>
            <button class="actie" data-actie="afronden" data-id="${taak.id}">Markeer als afgerond</button>
            <input type="date" data-actie="verzetten" data-id="${taak.id}" value="${taak.volgendeDatum}" title="Datum verzetten">
          </td>
        </tr>`;
    }).join("");

    return `
      <div class="melding">
        Dit is de <strong>jaarplanning</strong>. Terugkerende taken (dossierchecks, evaluaties, ontwikkel- en
        functioneringsgesprekken) worden hier automatisch opnieuw ingepland zodra je ze afrondt. Bekijk het tabblad
        <strong>Team</strong> voor ontwikkeldoelen, observaties en gespreksverslagen per medewerker, en
        <strong>Actielijst</strong> voor eenmalige taken, en <strong>Dashboard</strong> voor het weekoverzicht.
      </div>

      <div class="samenvatting">
        <div class="tegel rood"><span class="getal">${aantal("verlopen")}</span><span class="label">Verlopen</span></div>
        <div class="tegel oranje"><span class="getal">${aantal("deze-week")}</span><span class="label">Deze week</span></div>
        <div class="tegel geel"><span class="getal">${aantal("deze-maand")}</span><span class="label">Deze maand</span></div>
        <div class="tegel grijs"><span class="getal">${aantal("later")}</span><span class="label">Later dit jaar</span></div>
      </div>

      <div class="kaart">
        <div class="filters">
          <label>Locatie
            <select id="f-locatie">
              <option value="alle" ${filterLocatie === "alle" ? "selected" : ""}>Alle locaties</option>
              ${locatieOpties}
            </select>
          </label>
          <label>Doelgroep
            <select id="f-doelgroep">
              <option value="alle" ${filterDoelgroep === "alle" ? "selected" : ""}>Bewoners en medewerkers</option>
              <option value="bewoner" ${filterDoelgroep === "bewoner" ? "selected" : ""}>Alleen bewoners</option>
              <option value="medewerker" ${filterDoelgroep === "medewerker" ? "selected" : ""}>Alleen medewerkers</option>
            </select>
          </label>
          <label>Status
            <select id="f-status">
              <option value="alle" ${filterStatus === "alle" ? "selected" : ""}>Alle statussen</option>
              <option value="verlopen" ${filterStatus === "verlopen" ? "selected" : ""}>Verlopen</option>
              <option value="deze-week" ${filterStatus === "deze-week" ? "selected" : ""}>Deze week</option>
              <option value="deze-maand" ${filterStatus === "deze-maand" ? "selected" : ""}>Deze maand</option>
              <option value="later" ${filterStatus === "later" ? "selected" : ""}>Later dit jaar</option>
            </select>
          </label>
        </div>

        <table>
          <thead><tr>
            <th>Naam</th><th>Type</th><th>Locatie</th><th>Taak</th><th>Gepland op</th><th>Status</th><th>Laatst afgerond</th><th>Acties</th>
          </tr></thead>
          <tbody>${rijen || `<tr><td colspan="8" style="text-align:center;color:var(--grijs-tekst);padding:24px;">Geen taken gevonden met deze filters.</td></tr>`}</tbody>
        </table>
        <p class="klein-label">${zichtbaar.length} van ${alleTaken.length} taken getoond.</p>
      </div>

      <div class="kaart">
        <details class="instellingen" id="instellingen-blok">
          <summary>Instellingen: taaktypes, locaties, bewoners en medewerkers</summary>

          <div class="instel-blok">
            <h3>Taaktypes (bepalen wat er terugkeert en hoe vaak)</h3>
            <table>
              <thead><tr><th>Naam</th><th>Doelgroep</th><th>Frequentie (maanden)</th><th>Omschrijving</th><th></th></tr></thead>
              <tbody>
                ${state.taakTypes.map((tt) => `
                  <tr>
                    <td><input type="text" data-tt="${tt.id}" data-veld="naam" value="${tt.naam}"></td>
                    <td>${tt.doelgroep === "bewoner" ? "Bewoner" : "Medewerker"}</td>
                    <td><input type="number" min="1" style="width:70px" data-tt="${tt.id}" data-veld="frequentieMaanden" value="${tt.frequentieMaanden}"></td>
                    <td><input type="text" style="width:100%" data-tt="${tt.id}" data-veld="omschrijving" value="${tt.omschrijving || ""}"></td>
                    <td><button class="gevaar" data-verwijder-tt="${tt.id}">Verwijderen</button></td>
                  </tr>`).join("")}
              </tbody>
            </table>
            <div class="knopbalk"><button class="subtiel" id="btn-nieuw-tt">+ Nieuw taaktype (bewoner)</button></div>
          </div>

          <div class="instel-blok">
            <h3>Locaties</h3>
            <table>
              <thead><tr><th>Naam</th><th></th></tr></thead>
              <tbody>${state.locaties.map((l) => `<tr><td>${l.naam}</td><td><button class="gevaar" data-verwijder-loc="${l.id}">Verwijderen</button></td></tr>`).join("")}</tbody>
            </table>
            <div class="knopbalk"><button class="subtiel" id="btn-nieuw-loc">+ Nieuwe locatie</button></div>
          </div>

          <div class="instel-blok">
            <h3>Bewoners (${state.bewoners.length})</h3>
            <table>
              <thead><tr><th>Naam</th><th>Locatie</th><th></th></tr></thead>
              <tbody>${state.bewoners.map((b) => `
                <tr><td>${b.naam}</td><td>
                  <select data-persoon-locatie="bewoner:${b.id}">
                    ${state.locaties.map((l) => `<option value="${l.id}" ${l.id === b.locatieId ? "selected" : ""}>${l.naam}</option>`).join("")}
                  </select>
                </td><td><button class="gevaar" data-verwijder-persoon="bewoner:${b.id}">Verwijderen</button></td></tr>`).join("")}
              </tbody>
            </table>
            <div class="knopbalk"><button class="subtiel" id="btn-nieuw-bewoner">+ Nieuwe bewoner</button></div>
          </div>

          <div class="instel-blok">
            <h3>Medewerkers (${state.medewerkers.length})</h3>
            <table>
              <thead><tr><th>Naam</th><th>Locatie</th><th></th></tr></thead>
              <tbody>${state.medewerkers.map((m) => `
                <tr><td>${m.naam}</td><td>
                  <select data-persoon-locatie="medewerker:${m.id}">
                    ${state.locaties.map((l) => `<option value="${l.id}" ${l.id === m.locatieId ? "selected" : ""}>${l.naam}</option>`).join("")}
                  </select>
                </td><td><button class="gevaar" data-verwijder-persoon="medewerker:${m.id}">Verwijderen</button></td></tr>`).join("")}
              </tbody>
            </table>
            <div class="knopbalk"><button class="subtiel" id="btn-nieuw-medewerker">+ Nieuwe medewerker</button></div>
          </div>

          <div class="instel-blok">
            <h3>Back-up</h3>
            <p class="klein-label">Er is geen online opslag — bewaar zelf af en toe een back-upbestand, bijvoorbeeld op een netwerkschijf. ${backupStatusInfo().tekst}</p>
            <div class="knopbalk">
              <button class="subtiel" id="btn-export">Back-up downloaden (.json)</button>
              <label class="subtiel" style="cursor:pointer;">
                Back-up terugzetten
                <input type="file" id="btn-import" accept="application/json" style="display:none;">
              </label>
              <button class="gevaar" id="btn-reset">Terugzetten naar voorbeelddata</button>
            </div>
          </div>
        </details>
      </div>
    `;
  }

  function renderActielijst() {
    let zichtbaar = state.acties.slice();
    if (actieFilterLocatie !== "alle") zichtbaar = zichtbaar.filter((a) => a.locatieId === actieFilterLocatie);
    if (actieFilterPersoonType !== "alle") zichtbaar = zichtbaar.filter((a) => a.persoonType === actieFilterPersoonType);
    if (actieFilterStatus === "actief") zichtbaar = zichtbaar.filter((a) => a.status !== "afgerond");
    else if (actieFilterStatus !== "alle") zichtbaar = zichtbaar.filter((a) => a.status === actieFilterStatus);
    zichtbaar.sort((a, b) => a.deadline.localeCompare(b.deadline));

    const nietAfgerond = state.acties.filter((a) => a.status !== "afgerond");
    const aantalOpen = nietAfgerond.filter((a) => a.status === "open").length;
    const aantalBezig = nietAfgerond.filter((a) => a.status === "bezig").length;
    const aantalVerlopen = nietAfgerond.filter((a) => actieUrgentie(a) === "verlopen").length;
    const aantalDezeWeek = nietAfgerond.filter((a) => actieUrgentie(a) === "deze-week").length;

    const locatieOpties = state.locaties.map((l) => `<option value="${l.id}" ${actieFilterLocatie === l.id ? "selected" : ""}>${l.naam}</option>`).join("");

    const rijen = zichtbaar.map((actie) => {
      const urgentie = actieUrgentie(actie);
      const badge = actie.status === "afgerond"
        ? `<span class="badge later" style="background:var(--groen);">Afgerond</span>`
        : `<span class="badge ${urgentie}">${statusLabel[urgentie]}</span>`;
      return `
        <tr>
          <td><input type="text" style="width:100%" data-actie-veld="${actie.id}" data-veld="titel" value="${actie.titel}"></td>
          <td>
            <select data-actie-veld="${actie.id}" data-veld="locatieId">
              ${state.locaties.map((l) => `<option value="${l.id}" ${l.id === actie.locatieId ? "selected" : ""}>${l.naam}</option>`).join("")}
            </select>
          </td>
          <td>
            <select data-actie-veld="${actie.id}" data-veld="persoonType">
              <option value="geen" ${actie.persoonType === "geen" ? "selected" : ""}>Geen</option>
              <option value="bewoner" ${actie.persoonType === "bewoner" ? "selected" : ""}>Bewoner</option>
              <option value="medewerker" ${actie.persoonType === "medewerker" ? "selected" : ""}>Medewerker</option>
            </select>
            ${actie.persoonType === "geen" ? "" : `
              <select data-actie-veld="${actie.id}" data-veld="persoonId">
                ${(actie.persoonType === "bewoner" ? state.bewoners : state.medewerkers).map((p) => `<option value="${p.id}" ${p.id === actie.persoonId ? "selected" : ""}>${p.naam}</option>`).join("")}
              </select>`}
          </td>
          <td><input type="date" data-actie-veld="${actie.id}" data-veld="deadline" value="${actie.deadline}"></td>
          <td>
            <select data-actie-veld="${actie.id}" data-veld="status">
              <option value="open" ${actie.status === "open" ? "selected" : ""}>Open</option>
              <option value="bezig" ${actie.status === "bezig" ? "selected" : ""}>Bezig</option>
              <option value="afgerond" ${actie.status === "afgerond" ? "selected" : ""}>Afgerond</option>
            </select>
          </td>
          <td>${badge}</td>
          <td><button class="gevaar" data-verwijder-actie="${actie.id}">Verwijderen</button></td>
        </tr>`;
    }).join("");

    return `
      <div class="melding">
        De <strong>actielijst</strong> is voor eenmalige taken per locatie en/of persoon, met een deadline en status —
        anders dan de terugkerende taken in de jaarplanning.
      </div>

      <div class="samenvatting">
        <div class="tegel rood"><span class="getal">${aantalVerlopen}</span><span class="label">Verlopen</span></div>
        <div class="tegel oranje"><span class="getal">${aantalDezeWeek}</span><span class="label">Deze week</span></div>
        <div class="tegel geel"><span class="getal">${aantalBezig}</span><span class="label">Bezig</span></div>
        <div class="tegel grijs"><span class="getal">${aantalOpen}</span><span class="label">Open</span></div>
      </div>

      <div class="kaart">
        <div class="filters">
          <label>Locatie
            <select id="actie-f-locatie">
              <option value="alle" ${actieFilterLocatie === "alle" ? "selected" : ""}>Alle locaties</option>
              ${locatieOpties}
            </select>
          </label>
          <label>Gekoppeld aan
            <select id="actie-f-persoontype">
              <option value="alle" ${actieFilterPersoonType === "alle" ? "selected" : ""}>Alles</option>
              <option value="geen" ${actieFilterPersoonType === "geen" ? "selected" : ""}>Geen specifieke persoon</option>
              <option value="bewoner" ${actieFilterPersoonType === "bewoner" ? "selected" : ""}>Bewoners</option>
              <option value="medewerker" ${actieFilterPersoonType === "medewerker" ? "selected" : ""}>Medewerkers</option>
            </select>
          </label>
          <label>Status
            <select id="actie-f-status">
              <option value="actief" ${actieFilterStatus === "actief" ? "selected" : ""}>Open en bezig</option>
              <option value="open" ${actieFilterStatus === "open" ? "selected" : ""}>Alleen open</option>
              <option value="bezig" ${actieFilterStatus === "bezig" ? "selected" : ""}>Alleen bezig</option>
              <option value="afgerond" ${actieFilterStatus === "afgerond" ? "selected" : ""}>Alleen afgerond</option>
              <option value="alle" ${actieFilterStatus === "alle" ? "selected" : ""}>Alle statussen</option>
            </select>
          </label>
        </div>

        <table>
          <thead><tr><th>Titel</th><th>Locatie</th><th>Gekoppeld aan</th><th>Deadline</th><th>Status</th><th>Urgentie</th><th>Acties</th></tr></thead>
          <tbody>${rijen || `<tr><td colspan="7" style="text-align:center;color:var(--grijs-tekst);padding:24px;">Geen acties gevonden met deze filters.</td></tr>`}</tbody>
        </table>
        <p class="klein-label">${zichtbaar.length} van ${state.acties.length} acties getoond.</p>

        ${toonNieuweActie ? `
          <div class="nieuw-form">
            <div class="grow-veld"><label class="mini-label">Titel</label><input type="text" id="nieuw-actie-titel" style="width:100%"></div>
            <div class="grow-veld"><label class="mini-label">Omschrijving (optioneel)</label><textarea rows="2" id="nieuw-actie-omschrijving"></textarea></div>
            <div class="form-grid">
              <label class="mini-label">Locatie
                <select id="nieuw-actie-locatie">
                  ${state.locaties.map((l) => `<option value="${l.id}">${l.naam}</option>`).join("")}
                </select>
              </label>
              <label class="mini-label">Deadline
                <input type="date" id="nieuw-actie-deadline" value="${vandaag()}">
              </label>
              <label class="mini-label">Gekoppeld aan
                <select id="nieuw-actie-persoontype">
                  <option value="geen">Geen specifieke persoon</option>
                  <option value="bewoner">Bewoner</option>
                  <option value="medewerker">Medewerker</option>
                </select>
              </label>
              <label class="mini-label" id="nieuw-actie-bewoner-wrap" style="display:none;">Bewoner
                <select id="nieuw-actie-bewoner">${state.bewoners.map((b) => `<option value="${b.id}">${b.naam}</option>`).join("")}</select>
              </label>
              <label class="mini-label" id="nieuw-actie-medewerker-wrap" style="display:none;">Medewerker
                <select id="nieuw-actie-medewerker">${state.medewerkers.map((m) => `<option value="${m.id}">${m.naam}</option>`).join("")}</select>
              </label>
            </div>
            <div class="knopbalk">
              <button class="actie" id="btn-opslaan-actie">Actie toevoegen</button>
              <button class="subtiel" id="btn-annuleer-actie">Annuleren</button>
            </div>
          </div>` : `<div class="knopbalk"><button class="subtiel" id="btn-nieuwe-actie">+ Nieuwe actie</button></div>`}
      </div>
    `;
  }

  function renderTeam() {
    return teamGekozenMedewerker ? renderMedewerkerProfiel(teamGekozenMedewerker) : renderTeamOverzicht();
  }

  function renderTeamOverzicht() {
    let personen = state.medewerkers;
    if (teamFilterLocatie !== "alle") personen = personen.filter((m) => m.locatieId === teamFilterLocatie);
    personen = personen.slice().sort((a, b) => a.naam.localeCompare(b.naam));

    const locatieOpties = state.locaties.map((l) => `<option value="${l.id}" ${teamFilterLocatie === l.id ? "selected" : ""}>${l.naam}</option>`).join("");

    const kaarten = personen.map((m) => {
      const openDoelen = state.ontwikkeldoelen.filter((d) => d.medewerkerId === m.id && d.status === "open").length;
      const laatsteVerslag = state.gespreksverslagen.filter((v) => v.medewerkerId === m.id).sort((a, b) => b.datum.localeCompare(a.datum))[0];
      return `
        <div class="team-kaart">
          <h3>${m.naam}</h3>
          <div class="locatie">${locatieNaam(m.locatieId)}</div>
          <div class="metriek">🎯 ${openDoelen} open ontwikkeldoel${openDoelen === 1 ? "" : "en"}</div>
          <div class="metriek">💬 Laatste gesprek: ${laatsteVerslag ? naarNL(laatsteVerslag.datum) : "nog geen"}</div>
          <div class="knopbalk"><button class="actie" data-kies-medewerker="${m.id}">Bekijk profiel</button></div>
        </div>`;
    }).join("");

    return `
      <div class="melding">
        Overzicht van je team. Per medewerker houd je hier ontwikkeldoelen (GROW-methode), observaties
        (hoor/zie/voel/interpreteer) en gespreksverslagen bij.
      </div>
      <div class="kaart">
        <div class="filters">
          <label>Locatie
            <select id="team-f-locatie">
              <option value="alle" ${teamFilterLocatie === "alle" ? "selected" : ""}>Alle locaties</option>
              ${locatieOpties}
            </select>
          </label>
        </div>
        <div class="team-grid">${kaarten || `<p class="klein-label">Geen medewerkers gevonden met deze filter.</p>`}</div>
      </div>
    `;
  }

  function renderMedewerkerProfiel(id) {
    const m = state.medewerkers.find((x) => x.id === id);
    if (!m) { teamGekozenMedewerker = null; return renderTeamOverzicht(); }

    const jaarplanningTaken = state.taken
      .filter((t) => t.persoonType === "medewerker" && t.persoonId === id)
      .sort((a, b) => a.volgendeDatum.localeCompare(b.volgendeDatum));

    const doelen = state.ontwikkeldoelen.filter((d) => d.medewerkerId === id).sort((a, b) => a.streefdatum.localeCompare(b.streefdatum));
    const observaties = state.observaties.filter((o) => o.medewerkerId === id).sort((a, b) => b.datum.localeCompare(a.datum));
    const verslagen = state.gespreksverslagen.filter((v) => v.medewerkerId === id).sort((a, b) => b.datum.localeCompare(a.datum));

    const jaarplanningRijen = jaarplanningTaken.map((t) => {
      const tt = taakTypeVan(t.taakTypeId);
      const status = statusVan(t);
      return `
        <tr>
          <td>${tt ? tt.naam : "(verwijderd)"}</td>
          <td>${naarNL(t.volgendeDatum)}</td>
          <td><span class="badge ${status}">${statusLabel[status]}</span></td>
          <td><button class="actie" data-actie="afronden" data-id="${t.id}">Markeer als afgerond</button></td>
        </tr>`;
    }).join("");

    const doelKaarten = doelen.map((d) => `
      <div class="grow-kaart">
        <div class="grow-kop">
          <input type="text" style="font-weight:600;flex:1;min-width:200px;" data-doel="${d.id}" data-veld="titel" value="${d.titel}">
          <select data-doel="${d.id}" data-veld="status">
            <option value="open" ${d.status === "open" ? "selected" : ""}>Open</option>
            <option value="bereikt" ${d.status === "bereikt" ? "selected" : ""}>Bereikt</option>
            <option value="vervallen" ${d.status === "vervallen" ? "selected" : ""}>Vervallen</option>
          </select>
          <button class="gevaar" data-verwijder-doel="${d.id}">Verwijderen</button>
        </div>
        <div class="form-grid">
          <div class="grow-veld"><label class="mini-label">Goal — wat wil je bereiken?</label><textarea rows="2" data-doel="${d.id}" data-veld="g">${d.g}</textarea></div>
          <div class="grow-veld"><label class="mini-label">Reality — wat is de huidige situatie?</label><textarea rows="2" data-doel="${d.id}" data-veld="r">${d.r}</textarea></div>
          <div class="grow-veld"><label class="mini-label">Options — welke opties zijn er?</label><textarea rows="2" data-doel="${d.id}" data-veld="o">${d.o}</textarea></div>
          <div class="grow-veld"><label class="mini-label">Will — welke actie en wanneer?</label><textarea rows="2" data-doel="${d.id}" data-veld="w">${d.w}</textarea></div>
        </div>
        <label class="mini-label">Streefdatum
          <input type="date" data-doel="${d.id}" data-veld="streefdatum" value="${d.streefdatum}">
        </label>
      </div>`).join("") || `<p class="klein-label">Nog geen ontwikkeldoelen geregistreerd.</p>`;

    const observatieKaarten = observaties.map((o) => `
      <div class="grow-kaart">
        <div class="grow-kop">
          <input type="date" data-obs="${o.id}" data-veld="datum" value="${o.datum}">
          <button class="gevaar" data-verwijder-obs="${o.id}">Verwijderen</button>
        </div>
        <div class="form-grid">
          <div class="grow-veld"><label class="mini-label">Hoor</label><textarea rows="2" data-obs="${o.id}" data-veld="hoor">${o.hoor}</textarea></div>
          <div class="grow-veld"><label class="mini-label">Zie</label><textarea rows="2" data-obs="${o.id}" data-veld="zie">${o.zie}</textarea></div>
          <div class="grow-veld"><label class="mini-label">Voel</label><textarea rows="2" data-obs="${o.id}" data-veld="voel">${o.voel}</textarea></div>
          <div class="grow-veld"><label class="mini-label">Interpreteer</label><textarea rows="2" data-obs="${o.id}" data-veld="interpretatie">${o.interpretatie}</textarea></div>
        </div>
      </div>`).join("") || `<p class="klein-label">Nog geen observaties geregistreerd.</p>`;

    const verslagKaarten = verslagen.map((v) => `
      <div class="grow-kaart">
        <div class="grow-kop">
          <input type="date" data-verslag="${v.id}" data-veld="datum" value="${v.datum}">
          <select data-verslag="${v.id}" data-veld="type">
            <option value="Ontwikkelgesprek" ${v.type === "Ontwikkelgesprek" ? "selected" : ""}>Ontwikkelgesprek</option>
            <option value="Functioneringsgesprek" ${v.type === "Functioneringsgesprek" ? "selected" : ""}>Functioneringsgesprek</option>
            <option value="Ad-hoc gesprek" ${v.type === "Ad-hoc gesprek" ? "selected" : ""}>Ad-hoc gesprek</option>
          </select>
          <button class="gevaar" data-verwijder-verslag="${v.id}">Verwijderen</button>
        </div>
        <div class="grow-veld"><label class="mini-label">Samenvatting</label><textarea rows="2" data-verslag="${v.id}" data-veld="samenvatting">${v.samenvatting}</textarea></div>

        <div class="profiel-header">
          <h2>${m.naam}</h2>
          <select data-persoon-locatie="medewerker:${m.id}">

        <h3 style="font-size:14px;margin-top:16px;">Jaarplanning voor deze medewerker</h3>

      <div class="kaart">
        <h2>Ontwikkeldoelen (GROW)</h2>
        ${doelKaarten}
        ${teamToonNieuwDoel ? `
          <div class="nieuw-form">
            <div class="grow-veld"><label class="mini-label">Titel</label><input type="text" id="nieuw-doel-titel" style="width:100%"></div>
            <div class="form-grid">
              <div class="grow-veld"><label class="mini-label">Goal</label><textarea rows="2" id="nieuw-doel-g"></textarea></div>
              <div class="grow-veld"><label class="mini-label">Reality</label><textarea rows="2" id="nieuw-doel-r"></textarea></div>
              <div class="grow-veld"><label class="mini-label">Options</label><textarea rows="2" id="nieuw-doel-o"></textarea></div>
              <div class="grow-veld"><label class="mini-label">Will</label><textarea rows="2" id="nieuw-doel-w"></textarea></div>
            </div>
            <label class="mini-label">Streefdatum <input type="date" id="nieuw-doel-streefdatum" value="${vandaag()}"></label>
            <div class="knopbalk">
              <button class="actie" id="btn-opslaan-doel">Ontwikkeldoel toevoegen</button>
              <button class="subtiel" id="btn-annuleer-doel">Annuleren</button>
            </div>
          </div>` : `<div class="knopbalk"><button class="subtiel" id="btn-nieuw-doel">+ Nieuw ontwikkeldoel</button></div>`}
      </div>

      <div class="kaart">
        <h2>Observaties (hoor / zie / voel / interpreteer)</h2>
        ${observatieKaarten}
        ${teamToonNieuweObservatie ? `
          <div class="nieuw-form">
            <label class="mini-label">Datum <input type="date" id="nieuw-obs-datum" value="${vandaag()}"></label>

            <div class="dicteer-blok">
              <label class="mini-label">Observatiedagboek — dicteer of typ je observatie in gewone taal</label>
              <textarea rows="3" id="nieuw-obs-vrije-tekst" placeholder="Bijvoorbeeld: Ik hoorde de bewoner roepen. Ik zag dat de medewerker rustig bleef en ging zitten. Het voelde gespannen in de kamer. Waarschijnlijk had de bewoner pijn."></textarea>
              <div class="knopbalk">
                <button class="subtiel" id="btn-dicteer-obs" ${ondersteuntDicteren() ? "" : "disabled"}>🎤 Start dicteren</button>
                <button class="subtiel" id="btn-analyseer-obs">Analyseer en verdeel over hoor/zie/voel/interpreteer</button>
              </div>
              <p class="dicteer-note">
                ${ondersteuntDicteren()
                  ? "Dicteren gebruikt de spraakherkenning van je browser — dit is de enige plek in de app waar geluid naar een externe dienst (meestal Google) wordt gestuurd voor verwerking, en vereist internet. De rest van de app blijft volledig lokaal. De verdeling over hoor/zie/voel/interpreteer gebeurt wél lokaal met eenvoudige zoekwoorden — controleer en corrigeer het resultaat altijd."
                  : "Dicteren wordt niet ondersteund in deze browser (gebruik Chrome of Edge). Je kunt de tekst hierboven ook gewoon typen en op \"Analyseer\" klikken."}
              </p>
            </div>

            <div class="form-grid">
              <div class="grow-veld"><label class="mini-label">Hoor</label><textarea rows="2" id="nieuw-obs-hoor"></textarea></div>
              <div class="grow-veld"><label class="mini-label">Zie</label><textarea rows="2" id="nieuw-obs-zie"></textarea></div>
              <div class="grow-veld"><label class="mini-label">Voel</label><textarea rows="2" id="nieuw-obs-voel"></textarea></div>
              <div class="grow-veld"><label class="mini-label">Interpreteer</label><textarea rows="2" id="nieuw-obs-interpretatie"></textarea></div>
            </div>
            <div class="knopbalk">
              <button class="actie" id="btn-opslaan-obs">Observatie toevoegen</button>
              <button class="subtiel" id="btn-annuleer-obs">Annuleren</button>

      </div>

      <div class="kaart">
        <h2>Gespreksverslagen</h2>
        ${verslagKaarten}
        ${teamToonNieuwVerslag ? `
          <div class="nieuw-form">
            <div class="form-grid">
              <label class="mini-label">Datum <input type="date" id="nieuw-verslag-datum" value="${vandaag()}"></label>
              <label class="mini-label">Type
                <select id="nieuw-verslag-type">
                  <option value="Ontwikkelgesprek">Ontwikkelgesprek</option>
                  <option value="Functioneringsgesprek">Functioneringsgesprek</option>

                </select>
              </label>
            </div>
            <div class="grow-veld"><label class="mini-label">Samenvatting</label><textarea rows="2" id="nieuw-verslag-samenvatting"></textarea></div>
            <div class="grow-veld"><label class="mini-label">Afspraken</label><textarea rows="2" id="nieuw-verslag-afspraken"></textarea></div>
            <div class="knopbalk">
              <button class="actie" id="btn-opslaan-verslag">Verslag toevoegen</button>
              <button class="subtiel" id="btn-annuleer-verslag">Annuleren</button>
            </div>

  function renderBewoners() {
    return bewonersGekozenBewoner ? renderBewonerProfiel(bewonersGekozenBewoner) : renderBewonersOverzicht();
  }

  function renderBewonersOverzicht() {
    let personen = state.bewoners;
    if (bewonersFilterLocatie !== "alle") personen = personen.filter((b) => b.locatieId === bewonersFilterLocatie);
    personen = personen.slice().sort((a, b) => a.naam.localeCompare(b.naam));

    const locatieOpties = state.locaties.map((l) => `<option value="${l.id}" ${bewonersFilterLocatie === l.id ? "selected" : ""}>${l.naam}</option>`).join("");

    const kaarten = personen.map((b) => {
      const laatsteNotitie = state.bewonerNotities.filter((n) => n.bewonerId === b.id).sort((a, c) => c.datum.localeCompare(a.datum))[0];
      return `
        <div class="team-kaart">
          <h3>${b.naam}</h3>
          <div class="locatie">${locatieNaam(b.locatieId)}</div>
          <div class="metriek">${b.zorgvraag ? b.zorgvraag.slice(0, 70) + (b.zorgvraag.length > 70 ? "…" : "") : "Geen zorgvraag genoteerd"}</div>
          <div class="metriek">📝 Laatste aantekening: ${laatsteNotitie ? naarNL(laatsteNotitie.datum) : "nog geen"}</div>
          <div class="knopbalk"><button class="actie" data-kies-bewoner="${b.id}">Bekijk profiel</button></div>
        </div>`;
    }).join("");

    return `
      <div class="melding">
        Overzicht van je bewoners. Per bewoner houd je hier de zorgvraag, contactpersoon en dossieraantekeningen bij,
        naast de jaarplanning-taken die al voor hen gepland staan.
      </div>
      <div class="kaart">
        <div class="filters">
          <label>Locatie
            <select id="bewoners-f-locatie">
              <option value="alle" ${bewonersFilterLocatie === "alle" ? "selected" : ""}>Alle locaties</option>
              ${locatieOpties}
            </select>
          </label>
        </div>
        <div class="team-grid">${kaarten || `<p class="klein-label">Geen bewoners gevonden met deze filter.</p>`}</div>
      </div>
    `;
  }

  function renderBewonerProfiel(id) {
    const b = state.bewoners.find((x) => x.id === id);
    if (!b) { bewonersGekozenBewoner = null; return renderBewonersOverzicht(); }

    const jaarplanningTaken = state.taken
      .filter((t) => t.persoonType === "bewoner" && t.persoonId === id)
      .sort((a, c) => a.volgendeDatum.localeCompare(c.volgendeDatum));

    const notities = state.bewonerNotities.filter((n) => n.bewonerId === id).sort((a, c) => c.datum.localeCompare(a.datum));

    const jaarplanningRijen = jaarplanningTaken.map((t) => {
      const tt = taakTypeVan(t.taakTypeId);
      const status = statusVan(t);
      return `
        <tr>
          <td>${tt ? tt.naam : "(verwijderd)"}</td>
          <td>${naarNL(t.volgendeDatum)}</td>
          <td><span class="badge ${status}">${statusLabel[status]}</span></td>
          <td><button class="actie" data-actie="afronden" data-id="${t.id}">Markeer als afgerond</button></td>
        </tr>`;
    }).join("");

    const notitieKaarten = notities.map((n) => `
      <div class="grow-kaart">
        <div class="grow-kop">
          <input type="date" data-notitie="${n.id}" data-veld="datum" value="${n.datum}">
          <button class="gevaar" data-verwijder-notitie="${n.id}">Verwijderen</button>
        </div>
        <textarea rows="2" style="width:100%" data-notitie="${n.id}" data-veld="tekst">${n.tekst}</textarea>
      </div>`).join("") || `<p class="klein-label">Nog geen dossieraantekeningen geregistreerd.</p>`;

    return `
      <button class="subtiel" id="btn-terug-bewoners">← Terug naar bewonersoverzicht</button>

      <div class="kaart" style="margin-top:16px;">
        <div class="profiel-header">
          <h2>${b.naam}</h2>
          <select data-persoon-locatie="bewoner:${b.id}">
            ${state.locaties.map((l) => `<option value="${l.id}" ${l.id === b.locatieId ? "selected" : ""}>${l.naam}</option>`).join("")}
          </select>
        </div>

        <div class="form-grid">
          <div class="grow-veld breed"><label class="mini-label">Zorgvraag</label><textarea rows="2" data-bewoner="${b.id}" data-veld="zorgvraag">${b.zorgvraag || ""}</textarea></div>
          <div class="grow-veld"><label class="mini-label">Contactpersoon</label><input type="text" data-bewoner="${b.id}" data-veld="contactpersoonNaam" value="${b.contactpersoonNaam || ""}"></div>
          <div class="grow-veld"><label class="mini-label">Relatie</label><input type="text" data-bewoner="${b.id}" data-veld="contactpersoonRelatie" value="${b.contactpersoonRelatie || ""}"></div>
          <div class="grow-veld"><label class="mini-label">Telefoon</label><input type="text" data-bewoner="${b.id}" data-veld="contactpersoonTelefoon" value="${b.contactpersoonTelefoon || ""}"></div>
        </div>

        <h3 style="font-size:14px;margin-top:16px;">Jaarplanning voor deze bewoner</h3>
        <table>
          <thead><tr><th>Taak</th><th>Gepland op</th><th>Status</th><th>Actie</th></tr></thead>
          <tbody>${jaarplanningRijen || `<tr><td colspan="4" style="text-align:center;color:var(--grijs-tekst);">Geen geplande taken.</td></tr>`}</tbody>
        </table>
      </div>

      <div class="kaart">
        <h2>Dossieraantekeningen</h2>
        ${notitieKaarten}
        ${bewonersToonNieuweNotitie ? `
          <div class="nieuw-form">
            <label class="mini-label">Datum <input type="date" id="nieuw-notitie-datum" value="${vandaag()}"></label>
            <div class="grow-veld"><label class="mini-label">Aantekening</label><textarea rows="3" id="nieuw-notitie-tekst"></textarea></div>
            <div class="knopbalk">
              <button class="actie" id="btn-opslaan-notitie">Aantekening toevoegen</button>
              <button class="subtiel" id="btn-annuleer-notitie">Annuleren</button>
            </div>
          </div>` : `<div class="knopbalk"><button class="subtiel" id="btn-nieuwe-notitie">+ Nieuwe aantekening</button></div>`}
      </div>
    `;
  }

  function render() {
    renderNav();
    const main = document.getElementById("main");
    if (huidigTab === "jaarplanning") {
      main.innerHTML = renderJaarplanning();
      koppelJaarplanningEvents();
    } else if (huidigTab === "team") {
      main.innerHTML = renderTeam();
      koppelTeamEvents();
    } else if (huidigTab === "bewoners") {
      main.innerHTML = renderBewoners();
      koppelBewonersEvents();
    } else if (huidigTab === "actielijst") {
      main.innerHTML = renderActielijst();
      koppelActielijstEvents();
    } else {
      main.innerHTML = renderDashboard();
      koppelDashboardEvents();
    }
  }

  function koppelJaarplanningEvents() {
    const bij = (id, event, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(event, fn); };

    bij("f-locatie", "change", (e) => { filterLocatie = e.target.value; render(); });
    bij("f-doelgroep", "change", (e) => { filterDoelgroep = e.target.value; render(); });
    bij("f-status", "change", (e) => { filterStatus = e.target.value; render(); });

    document.querySelectorAll("[data-actie='afronden']").forEach((b) => b.addEventListener("click", () => markeerAfgerond(b.dataset.id)));
    document.querySelectorAll("[data-actie='verzetten']").forEach((inp) => inp.addEventListener("change", () => verzetDatum(inp.dataset.id, inp.value)));

    document.querySelectorAll("[data-tt]").forEach((inp) => inp.addEventListener("change", () => wijzigTaakType(inp.dataset.tt, inp.dataset.veld, inp.value)));
    document.querySelectorAll("[data-verwijder-tt]").forEach((b) => b.addEventListener("click", () => verwijderTaakType(b.dataset.verwijderTt)));
    bij("btn-nieuw-tt", "click", nieuwTaakType);

    document.querySelectorAll("[data-verwijder-loc]").forEach((b) => b.addEventListener("click", () => verwijderLocatie(b.dataset.verwijderLoc)));
    bij("btn-nieuw-loc", "click", voegLocatieToe);

    document.querySelectorAll("[data-verwijder-persoon]").forEach((b) => b.addEventListener("click", () => {
      const [type, id] = b.dataset.verwijderPersoon.split(":");
      verwijderPersoon(type, id);
    }));
    document.querySelectorAll("[data-persoon-locatie]").forEach((sel) => sel.addEventListener("change", () => {
      const [type, id] = sel.dataset.persoonLocatie.split(":");
      wijzigPersoonLocatie(type, id, sel.value);
    }));
    bij("btn-nieuw-bewoner", "click", () => voegPersoonToe("bewoner"));
    bij("btn-nieuw-medewerker", "click", () => voegPersoonToe("medewerker"));

    bij("btn-export", "click", exporteer);
    bij("btn-reset", "click", resetVoorbeelddata);
    bij("btn-import", "change", (e) => { if (e.target.files[0]) importeer(e.target.files[0]); });
  }

  function koppelTeamEvents() {
    const bij = (id, event, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(event, fn); };
    const waarde = (id) => { const el = document.getElementById(id); return el ? el.value : ""; };

    bij("team-f-locatie", "change", (e) => { teamFilterLocatie = e.target.value; render(); });
    document.querySelectorAll("[data-kies-medewerker]").forEach((b) => b.addEventListener("click", () => kiesMedewerker(b.dataset.kiesMedewerker)));
    bij("btn-terug-team", "click", terugNaarTeamoverzicht);

    if (!teamGekozenMedewerker) return;

    document.querySelectorAll("[data-persoon-locatie]").forEach((sel) => sel.addEventListener("change", () => {
      const [type, id] = sel.dataset.persoonLocatie.split(":");
      wijzigPersoonLocatie(type, id, sel.value);
    }));
    document.querySelectorAll("[data-actie='afronden']").forEach((b) => b.addEventListener("click", () => markeerAfgerond(b.dataset.id)));

    document.querySelectorAll("[data-doel]").forEach((el) => el.addEventListener("change", () => wijzigOntwikkeldoel(el.dataset.doel, el.dataset.veld, el.value)));
    document.querySelectorAll("[data-verwijder-doel]").forEach((b) => b.addEventListener("click", () => verwijderOntwikkeldoel(b.dataset.verwijderDoel)));
    bij("btn-nieuw-doel", "click", () => { teamToonNieuwDoel = true; render(); });
    bij("btn-annuleer-doel", "click", () => { teamToonNieuwDoel = false; render(); });
    bij("btn-opslaan-doel", "click", () => {
      voegOntwikkeldoelToe(teamGekozenMedewerker, {
        titel: waarde("nieuw-doel-titel"), g: waarde("nieuw-doel-g"), r: waarde("nieuw-doel-r"),
        o: waarde("nieuw-doel-o"), w: waarde("nieuw-doel-w"), streefdatum: waarde("nieuw-doel-streefdatum"),
      });
      teamToonNieuwDoel = false;
    });

    document.querySelectorAll("[data-obs]").forEach((el) => el.addEventListener("change", () => wijzigObservatie(el.dataset.obs, el.dataset.veld, el.value)));
    document.querySelectorAll("[data-verwijder-obs]").forEach((b) => b.addEventListener("click", () => verwijderObservatie(b.dataset.verwijderObs)));
    bij("btn-nieuwe-obs", "click", () => { teamToonNieuweObservatie = true; render(); });
    bij("btn-annuleer-obs", "click", () => { stopDicteren(); teamToonNieuweObservatie = false; render(); });
    bij("btn-opslaan-obs", "click", () => {
      stopDicteren();
      voegObservatieToe(teamGekozenMedewerker, {
        datum: waarde("nieuw-obs-datum"), hoor: waarde("nieuw-obs-hoor"), zie: waarde("nieuw-obs-zie"),
        voel: waarde("nieuw-obs-voel"), interpretatie: waarde("nieuw-obs-interpretatie"),
      });
      teamToonNieuweObservatie = false;
    });
    bij("btn-dicteer-obs", "click", () => {
      if (actieveHerkenning) stopDicteren();
      else startDicteren("nieuw-obs-vrije-tekst", "btn-dicteer-obs");
    });
    bij("btn-analyseer-obs", "click", () => {
      analyseerEnVerdeel("nieuw-obs-vrije-tekst", {
        hoor: "nieuw-obs-hoor", zie: "nieuw-obs-zie", voel: "nieuw-obs-voel", interpretatie: "nieuw-obs-interpretatie",
      });
    });

    document.querySelectorAll("[data-verslag]").forEach((el) => el.addEventListener("change", () => wijzigVerslag(el.dataset.verslag, el.dataset.veld, el.value)));
    document.querySelectorAll("[data-verwijder-verslag]").forEach((b) => b.addEventListener("click", () => verwijderVerslag(b.dataset.verwijderVerslag)));
    bij("btn-nieuw-verslag", "click", () => { teamToonNieuwVerslag = true; render(); });
    bij("btn-annuleer-verslag", "click", () => { teamToonNieuwVerslag = false; render(); });
    bij("btn-opslaan-verslag", "click", () => {
      voegVerslagToe(teamGekozenMedewerker, {
        datum: waarde("nieuw-verslag-datum"), type: waarde("nieuw-verslag-type"),
        samenvatting: waarde("nieuw-verslag-samenvatting"), afspraken: waarde("nieuw-verslag-afspraken"),
      });
      teamToonNieuwVerslag = false;
    });
  }

  function koppelBewonersEvents() {
    const bij = (id, event, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(event, fn); };
    const waarde = (id) => { const el = document.getElementById(id); return el ? el.value : ""; };

      const [type, id] = sel.dataset.persoonLocatie.split(":");
      wijzigPersoonLocatie(type, id, sel.value);
    }));
    document.querySelectorAll("[data-actie='afronden']").forEach((b) => b.addEventListener("click", () => markeerAfgerond(b.dataset.id)));

    document.querySelectorAll("[data-bewoner]").forEach((el) => el.addEventListener("change", () => wijzigBewonerVeld(el.dataset.bewoner, el.dataset.veld, el.value)));

    bij("btn-opslaan-notitie", "click", () => {

  function koppelActielijstEvents() {

    const waarde = (id) => { const el = document.getElementById(id); return el ? el.value : ""; };

    bij("btn-nieuwe-actie", "click", () => { toonNieuweActie = true; render(); });
    bij("btn-annuleer-actie", "click", () => { toonNieuweActie = false; render(); });
    bij("btn-opslaan-actie", "click", () => {
      const persoonType = waarde("nieuw-actie-persoontype");
      const persoonId = persoonType === "bewoner" ? waarde("nieuw-actie-bewoner") : persoonType === "medewerker" ? waarde("nieuw-actie-medewerker") : null;
      voegActieToe({
        titel: waarde("nieuw-actie-titel"), omschrijving: waarde("nieuw-actie-omschrijving"),
        locatieId: waarde("nieuw-actie-locatie"), deadline: waarde("nieuw-actie-deadline"),
        persoonType, persoonId,
      });
      toonNieuweActie = false;
    });

    // Toon/verberg bewoner- of medewerkerselectie in het nieuwe-actieformulier zonder de rest opnieuw te tekenen.
    bij("nieuw-actie-persoontype", "change", (e) => {
      const bewonerWrap = document.getElementById("nieuw-actie-bewoner-wrap");
      const medewerkerWrap = document.getElementById("nieuw-actie-medewerker-wrap");
      if (bewonerWrap) bewonerWrap.style.display = e.target.value === "bewoner" ? "block" : "none";
      if (medewerkerWrap) medewerkerWrap.style.display = e.target.value === "medewerker" ? "block" : "none";
    });
  }

  function koppelDashboardEvents() {
    const bij = (id, event, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(event, fn); };

    bij("dash-f-locatie", "change", (e) => { dashboardFilterLocatie = e.target.value; render(); });
    document.querySelectorAll("[data-dash-afronden-taak]").forEach((b) => b.addEventListener("click", () => markeerAfgerond(b.dataset.dashAfrondenTaak)));
    document.querySelectorAll("[data-dash-afronden-actie]").forEach((b) => b.addEventListener("click", () => wijzigActie(b.dataset.dashAfrondenActie, "status", "afgerond")));
    document.querySelectorAll("[data-dash-naar-medewerker]").forEach((b) => b.addEventListener("click", () => gaNaarMedewerkerProfiel(b.dataset.dashNaarMedewerker)));
  }

  render();
})();
</script>
</body>
</html>
